name: Arch Linux build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPRESS: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nathawatc/howdy-next/ci-archlinux:latest

    steps:
      - uses: actions/checkout@v7

      # Pull requests restore main's cache but never save their own, so they
      # cannot evict it from the repository cache quota.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-archlinux-${{ github.sha }}
          restore-keys: ccache-archlinux-

      - name: Configure
        run: cmake --preset release -DHOWDY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release --parallel "$(nproc)"

      - name: Test
        run: ctest --preset release

      - name: Cargo deny
        run: cmake --build --preset release --target howdy_cargo_deny

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-archlinux-${{ github.sha }}
