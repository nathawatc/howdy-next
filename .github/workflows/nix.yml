name: Nix package build and test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nathawatc/howdy-next/ci-nix:2.35.3-1
      env:
        HOME: /root

    steps:
      - uses: actions/checkout@v7

      - name: Verify prebuilt dependencies
        run: bash ci/nix/check-prebuilt.sh

      - name: Evaluate both Linux systems
        run: |
          nix flake check \
            --offline \
            --no-update-lock-file \
            --no-build \
            --all-systems

      - name: Build, test, and check package installation
        run: |
          nix build \
            --offline \
            --no-update-lock-file \
            --no-link \
            --max-jobs 1 \
            --print-build-logs \
            .#checks.x86_64-linux.package
