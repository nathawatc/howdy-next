name: PAM authentication issue
description: Report sudo, login, polkit, lock-screen, or pam_howdy problems.
title: "bug(pam): "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for `pam_howdy.so` issues (sudo, login, polkit, lock screens, prompt behavior, or helper errors).

        Keep a root shell open while editing `/etc/pam.d/`. Run `sudo howdy test` first so camera or model errors are ruled out.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe what failed and what you expected instead.
    validations:
      required: true

  - type: dropdown
    id: pam-consumer
    attributes:
      label: PAM service
      options:
        - sudo
        - login / TTY
        - polkit
        - display manager (GDM, SDDM, greetd, LightDM)
        - lock screen
        - system-auth / common stack
        - other
    validations:
      required: true

  - type: dropdown
    id: workaround
    attributes:
      label: Workaround option
      description: Option set on the `pam_howdy.so` line.
      options:
        - none (default)
        - workaround=native
        - workaround=input
        - workaround=native-input
        - not sure
    validations:
      required: true

  - type: textarea
    id: pam-config
    attributes:
      label: PAM config
      description: Relevant lines from `/etc/pam.d/`.
      render: shell
      placeholder: |
        auth sufficient pam_howdy.so workaround=native
        auth sufficient pam_unix.so try_first_pass nullok
    validations:
      required: true

  - type: textarea
    id: outside-pam-test
    attributes:
      label: "`sudo howdy test` output"
      description: Paste output from outside PAM, or explain why it cannot run.
      render: shell
    validations:
      required: true

  - type: textarea
    id: auth-log
    attributes:
      label: Logs
      description: Relevant `journalctl` or auth log lines around the failure. Strip private data.
      placeholder: |
        sudo journalctl -b --no-pager | grep -Ei 'howdy|sudo|login|polkit|waylock|greetd|sddm|gdm|lightdm|pam|seccomp|segfault|coredump|opencv'
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Howdy version (`howdy version`):
        - Distro / install method:
        - Kernel:
        - Session / display server:
    validations:
      required: true

  - type: textarea
    id: helper-paths
    attributes:
      label: Helper & path permissions (lock screen / unprivileged PAM)
      description: Optional. Include if authentication runs unprivileged.
      placeholder: |
        ls -ld /etc/howdy /etc/howdy/models /etc/howdy/config.ini
        ls -l /usr/libexec/howdy/howdy-auth-helper # or /run/wrappers/bin/howdy-auth-helper
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested `sudo howdy test` outside PAM first.
          required: true
        - label: I removed private data from configs and logs.
          required: true
