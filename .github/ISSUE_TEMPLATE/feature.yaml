name: Feature request
description: Propose a focused change or improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Howdy Next is feature-complete, so proposals need a clear use case. Explain the problem first; for auth or security changes, note trust-boundary impact.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or gap does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired behavior. Add a CLI, config, or PAM example if helpful.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - PAM
        - Camera / recognition
        - Config / storage
        - Packaging / docs
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Alternatives, risks, or context
      description: Optional. Alternatives considered, compatibility/security impact, or related links.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues and wiki pages first.
          required: true
