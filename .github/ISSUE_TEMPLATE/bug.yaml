name: Bug report
description: Report a CLI, camera, recognition, or packaging bug.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For `pam_howdy.so` issues, use the **PAM authentication issue** form instead.

        Before filing, run `sudo howdy test` and check the troubleshooting wiki. Paste logs as text, not screenshots, unless the UI itself is the bug.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: actual-expected
    attributes:
      label: Actual vs. expected result
      description: Include exact error messages or terminal output.
      value: |
        - Actual:
        - Expected:
    validations:
      required: true

  - type: input
    id: howdy-version
    attributes:
      label: Howdy Next version
      placeholder: Output of `howdy version`, package version, or commit hash
    validations:
      required: true

  - type: input
    id: install-source
    attributes:
      label: Installation source
      placeholder: AUR howdy-next, AUR howdy-next-git, Nix flake, source build
    validations:
      required: true

  - type: textarea
    id: system-info
    attributes:
      label: System information
      value: |
        - Distro:
        - Kernel:
        - Session / display server:
        - Camera device/path:
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Optional. Relevant `/etc/howdy/config.ini` keys (strip private data).
      render: ini
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and command output
      description: Optional. Relevant `sudo howdy test`, `sudo howdy snapshot`, or `journalctl -b` output (strip private data).
      placeholder: |
        sudo journalctl -b --no-pager | grep -Ei 'howdy|opencv|seccomp|segfault|coredump'
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested recognition outside PAM with `sudo howdy test` when applicable.
          required: false
        - label: I checked existing issues and the troubleshooting wiki.
          required: true
        - label: I removed private data from logs and configs.
          required: true
