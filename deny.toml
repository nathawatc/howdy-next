# cargo-deny policy: `cmake --build --preset release --target howdy_cargo_deny`.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Only licenses compatible with distributing the combined work under GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow-list is policy, not inventory; entries may be unused.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
